<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pembaruan Sistem PARENGGEKITA</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
      color: #0c2340;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #3888cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.25rem; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: #64748b; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Memuat Versi Terbaru...</h2>
  <p>Sedang membersihkan tembolok lama ponsel Anda.</p>

  <script>
    (function() {
      // 1. Bersihkan seluruh local & session storage
      try {
        localStorage.clear();
        sessionStorage.clear();
      } catch (_) {}

      // 2. Bersihkan cache storage WebKit jika ada
      if ('caches' in window) {
        try {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        } catch (_) {}
      }

      // 3. Alihkan langsung ke index.html dengan penanda waktu unik murni
      setTimeout(function() {
        var freshTime = new Date().getTime();
        window.location.replace("index.html?update=" + freshTime);
      }, 600);
    })();
  </script>
</body>
</html>
