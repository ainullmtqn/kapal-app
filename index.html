<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PARENGGEKITA - Sistem Manifes & Nota Logistik Kapal</title>
  <link rel="icon" type="image/png" href="logo.png">
  <!-- Google Fonts: Comfortaa (Logo Typography) & Plus Jakarta Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======================================================== -->
  <!-- TOP APP NAVBAR (RENDERED BY js/app.js: initNavbar)        -->
  <!-- ======================================================== -->
  <header class="app-navbar no-print" id="appNavbar"></header>

  <!-- ======================================================== -->
  <!-- MAIN CONTENT PER TAB BAR (MODULAR JS COMPONENTS)         -->
  <!-- ======================================================== -->
  <main class="main-wrapper">
    <!-- TAB 1: BERANDA / DASHBOARD (js/dashboard.js) -->
    <section id="tabDashboard" class="tab-pane no-print"></section>

    <!-- TAB 2: KAPAL ONGKIR (js/kapal.js) -->
    <section id="tabKapal" class="tab-pane no-print" style="display: none;"></section>

    <!-- TAB 3: MUATAN PARENGGE (js/muatan.js) -->
    <section id="tabMuatan" class="tab-pane no-print" style="display: none;"></section>

    <!-- TAB 4: AUDIT & SELISIH (js/audit.js) -->
    <section id="tabAudit" class="tab-pane no-print" style="display: none;"></section>

    <!-- TAB 5: PENGATURAN & CADANGAN (js/setting.js) -->
    <section id="tabSetting" class="tab-pane no-print" style="display: none;"></section>
  </main>

  <!-- ======================================================== -->
  <!-- MODAL NOTA KONTAN CETAK A6 (js/nota.js)                  -->
  <!-- ======================================================== -->
  <div class="modal-overlay" id="notaModal"></div>

  <!-- ======================================================== -->
  <!-- MOBILE BOTTOM NAVIGATION (js/app.js: initNavbar)         -->
  <!-- ======================================================== -->
  <nav class="bottom-nav no-print" id="bottomNav"></nav>

  <!-- ======================================================== -->
  <!-- MODULAR JAVASCRIPT PER MAIN BAR & CORE LOGIC             -->
  <!-- ======================================================== -->
  <script src="chart.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/kapal.js"></script>
  <script src="js/muatan.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/nota.js"></script>
  <script src="js/setting.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
