<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PARENGGEKITA - Sistem Manifes & Nota Logistik Kapal</title>
  <link rel="icon" type="image/png" href="logo.png">
  <!-- Google Fonts: Comfortaa (Logo Typography) & Plus Jakarta Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261124_01">
</head>
<body>

  <!-- ======================================================== -->
  <!-- TOP APP NAVBAR (RENDERED BY js/app.js: initNavbar)        -->
  <!-- ======================================================== -->
  <header class="app-navbar no-print" id="appNavbar"></header>

  <!-- ======================================================== -->
  <!-- MAIN CONTENT PER TAB BAR (MODULAR JS COMPONENTS)         -->
  <!-- ======================================================== -->
  <main class="main-wrapper">
    <!-- TAB 0: INFORMASI ONGKIR HARI INI / WARTA PUBLIK (js/warta.js) -->
    <section id="tabWarta" class="tab-pane no-print"></section>

    <!-- TAB 1: BERANDA / DASHBOARD (js/dashboard.js) -->
    <section id="tabDashboard" class="tab-pane no-print" style="display: none;"></section>

    <!-- TAB 2: KAPAL ONGKIR (js/kapal.js) -->
    <section id="tabKapal" class="tab-pane no-print" style="display: none;"></section>

    <!-- TAB 3: MUATAN PARENGGE (js/muatan.js) -->
    <section id="tabMuatan" class="tab-pane no-print" style="display: none;"></section>

    <!-- TAB 4: PENGATURAN & CADANGAN (js/setting.js) -->
    <section id="tabSetting" class="tab-pane no-print" style="display: none;"></section>
  </main>

  <!-- ======================================================== -->
  <!-- MODAL NOTA KONTAN CETAK A6 (js/nota.js)                  -->
  <!-- ======================================================== -->
  <div class="modal-overlay" id="notaModal" onclick="if(event.target===this) tutupNota()"></div>

  <!-- ======================================================== -->
  <!-- MODAL INPUT PELAYARAN BARU (js/kapal.js)                 -->
  <!-- ======================================================== -->
  <div class="modal-overlay" id="tambahPelayaranModal" onclick="if(event.target===this) tutupModalTambahPelayaran()"></div>

  <!-- ======================================================== -->
  <!-- MODAL AUTENTIKASI KATA SANDI PENGELOLA (js/app.js)       -->
  <!-- ======================================================== -->
  <div class="modal-overlay" id="adminAuthModal" onclick="if(event.target===this) tutupModalAuthPengelola()"></div>

  <!-- ======================================================== -->
  <!-- MOBILE BOTTOM NAVIGATION (js/app.js: initNavbar)         -->
  <!-- ======================================================== -->
  <nav class="bottom-nav no-print" id="bottomNav"></nav>

  <!-- ======================================================== -->
  <!-- MODULAR JAVASCRIPT PER MAIN BAR & CORE LOGIC             -->
  <!-- ======================================================== -->
  <script src="chart.min.js"></script>
  <script src="js/core.js?v=20261124_01"></script>
  <script src="js/warta.js?v=20261124_01"></script>
  <script src="js/dashboard.js?v=20261124_01"></script>
  <script src="js/kapal.js?v=20261124_01"></script>
  <script src="js/muatan.js?v=20261124_01"></script>
  <script src="js/nota.js?v=20261124_01"></script>
  <script src="js/setting.js?v=20261124_01"></script>
  <script src="js/app.js?v=20261124_01"></script>
</body>
</html>
